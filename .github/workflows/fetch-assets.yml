name: fetch-assets
on:
  push:
    branches: [claude/crescenthealthyyc-vercel-deploy-9jzw5s]
    paths: [".github/workflows/fetch-assets.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image assets
        run: |
          set -euo pipefail
          D=frontend/public/images
          mkdir -p "$D"
          A=https://customer-assets-4nw71qhi.emergentagent.net/job_8d3ec219-8596-4c66-bad8-677f53c921e9/artifacts
          I=https://static.prod-images.emergentagent.com/jobs/8d3ec219-8596-4c66-bad8-677f53c921e9/images
          dl() { curl -fsSL --retry 3 -o "$D/$1" "$2"; }
          dl logo-pharmasave.png "$A/rtq43l3p_4_Pharmasave_Primary_Logo_RGB.png"
          dl logo-crescent.png "$A/ej2sgj35_Transparent%2BPNG%2B-%2Busable%2Beverywhere.-01-01%2B%282%29%2B%281%29%2B%281%29%20%282%29.png"
          dl logo-physio.png "$A/edocribc_physio-horizontal.png"
          dl hero.png "$I/af4c083fd347977db1678e7bf3097a96bf232f26c4d673a2fbd71579f57b20f3.png"
          dl pharmacy.png "$I/d206d16469dc5d67c44748644eeaf6e69d23981ca3bcce3312f7e063265c327c.png"
          dl clinic.png "$I/aab8a605fbe23e2a0b6bb08c86d12fa48bcbea80ff539316e2de62c26d8bed5f.png"
          dl physio.png "$I/e627d3942bc317ffbd7c7253e8ba0fdfb7a2eb9165cde808ac4079816a9fd5f9.png"
          dl og-image.png "$I/2f1d22ffa3303a48782cd539bea28128eb79a1f51e2de2564bcc848cdb9865eb.png"
          file "$D"/*
          ls -la "$D"
      - name: Commit assets and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch-assets.yml
          git add frontend/public/images
          git commit -m "Add self-hosted image assets"
          git push
